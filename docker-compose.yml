name: job-queue-service

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jobqueue:jobqueue@postgres:5432/jobqueue}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  ENVIRONMENT: ${ENVIRONMENT:-local}
  # Distributed-safety timings. Defaults are the production values; overriding
  # them (a short lease, for example) is how the crash-recovery demo is run
  # without editing code.
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-1}
  JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-60}
  JOB_HEARTBEAT_SECONDS: ${JOB_HEARTBEAT_SECONDS:-20}
  SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-1}
  SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-100}
  RECOVERY_INTERVAL_SECONDS: ${RECOVERY_INTERVAL_SECONDS:-5}
  RECOVERY_BATCH_SIZE: ${RECOVERY_BATCH_SIZE:-100}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobqueue}
      POSTGRES_USER: ${POSTGRES_USER:-jobqueue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobqueue}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobqueue} -d ${POSTGRES_DB:-jobqueue}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot schema migration. Runs to completion before api and worker start,
  # so exactly one process applies migrations.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    command: ["./scripts/start-api.sh"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/health').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["./scripts/start-worker.sh"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Long enough for a draining attempt to finish and persist. Not an
    # application timeout: SIGKILL after this window is the same crash path
    # as any other hard kill, and lease recovery retries the job.
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  postgres_data:
